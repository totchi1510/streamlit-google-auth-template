# Copy to secrets.toml. Never commit secrets.toml.
[auth]
# Register this exact URI in Google Cloud.
redirect_uri = "http://localhost:8501/oauth2callback"
# Generate with: openssl rand -hex 32
cookie_secret = "replace-with-a-random-secret"
client_id = "replace-with-google-client-id"
client_secret = "replace-with-google-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access]
allowed_email_domains = ["s.okayama-u.ac.jp", "okayama-u.ac.jp"]
# Google Workspace's hd claim may use the parent domain for student accounts.
allowed_google_hosted_domains = ["s.okayama-u.ac.jp", "okayama-u.ac.jp"]
